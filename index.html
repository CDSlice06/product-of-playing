<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Trae Project</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        // 禁用右键菜单
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        // 禁用拖拽保存
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
        // 图片/Canvas 上禁止选中
        document.addEventListener('selectstart', function(e) {
          var t = e.target.tagName;
          if (t === 'IMG' || t === 'CANVAS') e.preventDefault();
        });
        // 阻止 Ctrl+S / Ctrl+U / F12 / Ctrl+Shift+I / Ctrl+Shift+C
        document.addEventListener('keydown', function(e) {
          if (e.key === 'F12') { e.preventDefault(); return; }
          if (e.ctrlKey || e.metaKey) {
            if (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U') { e.preventDefault(); return; }
            if (e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
          }
        });
      })();
    </script>
  </body>
</html>
